<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Language Habit Tracker</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --border: #e3e3e8;
    --accent: #0a84ff;
    --done: #34c759;
    --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 16px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .topbar h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  
    /* ---------- view tabs ---------- */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    padding: 4px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }
  .tab {
    flex: 1;
    padding: 9px 6px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .tab:active { opacity: .7; }
  .tab.active { background: var(--accent); color: #fff; }

  /* ---------- cards ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .section-head h2 { margin: 0; font-size: 17px; cursor: pointer; }
  .section-head h3 { margin: 0; font-size: 15px; }
  .section-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- chips ---------- */
  .chip {
    font: inherit; font-size: 12px; line-height: 1;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .chip:active { opacity: .55; }
  .chip.danger { color: var(--danger); }
    .day-start-select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 26px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%230a84ff' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    font-size: 12px;
  }
  .day-start-select option {
    background: var(--card);
    color: var(--text);
  }

  /* ---------- habit list ---------- */
  .habits { list-style: none; margin: 0; padding: 0; }
  .habit { border-top: 1px solid var(--border); }
  .habit:first-child { border-top: none; }
  .empty-row { color: var(--muted); font-size: 13px; padding: 8px 0; list-style: none; }

  /* check habit */
  .habit.check {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
  }
  .check-label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
  .check-label input { width: 21px; height: 21px; accent-color: var(--accent); flex: none; }
  .habit.check .name { font-size: 15px; }
  .habit.check.done .name { color: var(--muted); text-decoration: line-through; }
    .habit.check.has-repeat .check-label input {
    appearance: none;
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    position: relative;
    transition: border-color .15s, background .15s;
    background: transparent;
  }
  .habit.check.has-repeat.partial .check-label input { border-color: var(--accent); }
  .habit.check.has-repeat.partial .check-label input::after {
    content: '';
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.7;
  }
  .habit.check.has-repeat.done .check-label input {
    background: var(--done);
    border-color: var(--done);
  }
  .habit.check.has-repeat.done .check-label input::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
  }
  .check-count.partial { color: var(--accent); }
    /* --- just-logged feedback --- */
  @keyframes check-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.45); }
    100% { transform: scale(1); }
  }
  @keyframes check-ring {
    0%   { box-shadow: 0 0 0 0   rgba(10, 132, 255, 0.55); }
    100% { box-shadow: 0 0 0 12px rgba(10, 132, 255, 0);    }
  }
  @keyframes count-bump {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .habit.just-logged .check-label input {
    animation: check-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .habit.has-repeat.just-logged .check-label input {
    animation:
      check-pop  0.45s cubic-bezier(0.34, 1.56, 0.64, 1),
      check-ring 0.6s ease-out;
  }
  .habit.just-logged .check-count {
    animation: count-bump 0.45s ease-out;
  }

  /* counter habit */
  .habit.counter { padding: 10px 0 10px; }
  .habit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .habit-head .name { font-size: 15px; font-weight: 500; }
  .habit.counter.is-done .name { color: var(--done); }
.habit.skipped { opacity: 0.45; }
.habit.skipped .name { text-decoration: line-through; }
.check-count {
  font-size: 12px; color: var(--muted); margin-left: 8px;
  font-weight: 500; font-variant-numeric: tabular-nums; flex: none;
}
.check-count.done { color: var(--done); }
.icon.rep-on { color: var(--accent); }
.icon.skip-on { color: var(--danger); }

  .counter-row { display: flex; align-items: stretch; gap: 6px; }
  
  .step-btn {
    flex: none;
    min-width: 62px;
    height: 46px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .step-btn:active { background: var(--border); }

  .value-slot { flex: 1; min-width: 0; display: flex; align-items: center; }
  .value-btn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .value-btn.has-value { color: var(--text); }
  .habit.counter.is-done .value-btn { color: var(--done); }

  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-left: 2px; }
  .meta-chip {
    font: inherit;
    font-size: 11.5px;
    line-height: 1;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .meta-chip:active { background: var(--border); }
  .meta-chip.add { color: var(--accent); border-style: dashed; }
  .counter-row-repeat { margin-top: 4px; }
.counter-row-repeat .step-btn { min-width: 46px; height: 32px; font-size: 13px; padding: 0 8px; border-radius: 8px; font-weight: 500; }
.counter-row-repeat .value-btn { height: 32px; font-size: 13px; }

  /* ---------- icons ---------- */
  .icon {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 15px; line-height: 1;
    padding: 7px 8px; cursor: pointer; flex: none;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .icon:hover { color: var(--text); }
  .habit-head-actions { display: flex; align-items: center; flex: none; }
.icon[disabled] { opacity: .25; pointer-events: none; }

  /* ---------- inline inputs ---------- */
  .inline-input {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--accent);
    border-radius: 0;
    padding: 2px 3px;
    outline: none;
    min-width: 3ch;
    text-align: center;
  }
  .inline-input.name-input { text-align: left; flex: 1; width: auto !important; min-width: 0; }
  .section-head .name-input { flex: 0 1 auto; width: 12ch !important; }
  .inline-input.value-input { width: 100%; text-align: center; font-weight: 600; }

  /* ---------- progress ---------- */
  .progress { margin-top: 12px; }
  .progress-text { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--done); border-radius: 3px; transition: width .2s ease; }

  /* ---------- history ---------- */
  .history-group { margin-top: 10px; }
  .history-section { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .history-list { list-style: none; margin: 0; padding: 0; }
  .history-list li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 4px 0; }
  .history-list .value { color: var(--muted); }

  /* ---------- misc ---------- */
  .wide-btn {
    display: block; width: 100%;
    padding: 15px;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--accent);
    font: inherit; font-size: 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wide-btn:active { opacity: .6; }
  .wide-btn.danger { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; font-size: 14px; padding: 28px 12px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; margin: 8px 0 0; }
  .note b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
    <header class="topbar">
    <div>
      <h1>Language Habits</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div id="dayStartSlot"></div>
  </header>
    <nav class="tabs" id="tabs">
    <button class="tab" data-view="yesterday">Yesterday</button>
    <button class="tab" data-view="today">Today</button>
    <button class="tab" data-view="history">History</button>
  </nav>
  <main id="app"></main>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'language-habit-tracker-v1';

  /* ================================================================== */
  /* small helpers                                                       */
  /* ================================================================== */

  const uid = () => (self.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function dateKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
    function dayStartHour() {
    return (data.settings && data.settings.dayStartHour) || 0;
  }
  function activeDateKey(now) {
    const d = now ? new Date(now) : new Date();
    if (d.getHours() < dayStartHour()) d.setDate(d.getDate() - 1);
    return dateKey(d);
  }
  function shiftKey(days) {
    const d = new Date();
    if (d.getHours() < dayStartHour()) d.setDate(d.getDate() - 1);
    d.setDate(d.getDate() + days);
    return dateKey(d);
  }
  function friendlyDate(key) {
        if (key === activeDateKey()) return 'Today';
    if (key === shiftKey(-1)) return 'Yesterday';
    const [y, m, d] = key.split('-').map(Number);
    const opts = { weekday: 'short', month: 'short', day: 'numeric' };
    if (y !== new Date().getFullYear()) opts.year = 'numeric';
    return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
  }

  function formatMinutes(mins) {
    mins = Math.round(mins);
    if (!mins) return '0m';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (!h) return m + 'm';
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  function formatValue(habit, value) {
    const isTime = habit.type === 'time';
    const main = isTime ? formatMinutes(value) : String(value);
    let out = main;
    if (habit.target != null && habit.target > 0) {
      out += ' / ' + (isTime ? formatMinutes(habit.target) : habit.target);
    }
    if (!isTime && habit.unit) out += ' ' + habit.unit;
    return out;
  }

    function formatCounterValue(type, value, target, unit) {
    const isTime = type === 'time';
    const main = isTime ? formatMinutes(value) : String(value);
    let out = main;
    if (target != null && target > 0) {
      out += ' / ' + (isTime ? formatMinutes(target) : target);
    }
    if (!isTime && unit) out += ' ' + unit;
    return out;
  }
  
  function parseDuration(input) {
  const s = String(input).trim().toLowerCase().replace(/\s+/g, '');
  if (!s) return null;
  // Plain number → interpret as minutes.
  if (/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s));
  // Otherwise parse "1h30m", "1.5h", "45min", "2 hours", etc.
  let total = 0, matched = false;
  const re = /(\d+(?:\.\d+)?)(h|hr|hrs|hour|hours|m|min|mins|minute|minutes)/g;
  let m;
  while ((m = re.exec(s)) !== null) {
    matched = true;
    const n = parseFloat(m[1]);
    total += m[2][0] === 'h' ? n * 60 : n;
  }
  return matched ? Math.round(total) : null;
}

  /* ================================================================== */
  /* state                                                               */
  /* ================================================================== */

    function starterData() {
    return {
      settings: { dayStartHour: 0 },
      sections: [
        {
          id: uid(),
          name: 'Spanish',
          habits: [
            { id: uid(), name: 'Anki reviews', type: 'check' },
            { id: uid(), name: 'New words', type: 'count', target: 30, unit: 'words', step: 5 },
            { id: uid(), name: 'Listening practice', type: 'time', target: 30, step: 5 }
          ]
        }
      ],
      logs: {}
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.sections) && parsed.logs && typeof parsed.logs === 'object') {
          if (!parsed.settings) parsed.settings = { dayStartHour: 0 };
          return parsed;
        }
      }
    } catch (err) {
      console.warn('Could not read saved data:', err);
    }
    return starterData();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      console.warn('Could not save:', err);
    }
  }

    let data = load();
  let view = 'today';       // 'today' | 'yesterday' | 'history'
  let currentDay = activeDateKey();

    let justLoggedId = null;
  let justLoggedTimer = null;
  function markJustLogged(id) {
    justLoggedId = id;
    clearTimeout(justLoggedTimer);
    justLoggedTimer = setTimeout(() => { justLoggedId = null; }, 700);
  }

  /* ================================================================== */
  /* log access                                                          */
  /* ================================================================== */

    function getEntry(key, habitId, slot) {
    const day = data.logs[key];
    if (!day) return undefined;
    return day[slot ? habitId + ':' + slot : habitId];
  }

    function setEntry(key, habitId, value, skipSave, slot) {
    const k = slot ? habitId + ':' + slot : habitId;
    const isEmpty = value === undefined || value === null || value === false || value === 0;
    if (isEmpty) {
      const day = data.logs[key];
      if (day) {
        delete day[k];
        if (Object.keys(day).length === 0) delete data.logs[key];
      }
    } else {
      (data.logs[key] = data.logs[key] || {})[k] = value;
    }
    if (!skipSave) save();
  }

      function purgeHabitLogs(habitId) {
    for (const key of Object.keys(data.logs)) {
      delete data.logs[key][habitId];
      delete data.logs[key][habitId + ':r'];
      delete data.logs[key][habitId + ':skip'];
      if (Object.keys(data.logs[key]).length === 0) delete data.logs[key];
    }
  }

    function isSkipped(key, habitId) {
    const day = data.logs[key];
    return !!(day && day[habitId + ':skip']);
  }

  function toggleSkip(key, habitId) {
    if (isSkipped(key, habitId)) {
      delete data.logs[key][habitId + ':skip'];
      if (Object.keys(data.logs[key]).length === 0) delete data.logs[key];
    } else {
      (data.logs[key] = data.logs[key] || {})[habitId + ':skip'] = true;
    }
    save();
    render();
  }

  function habitIsDone(key, habit) {
    if (isSkipped(key, habit.id)) return false;

    if (habit.type === 'check') {
      const raw = getEntry(key, habit.id);
      if (habit.repeatTarget != null) {
        const n = typeof raw === 'number' ? raw : 0;
        return n >= habit.repeatTarget;
      }
      return !!raw;
    }

    // counter
    const v = typeof getEntry(key, habit.id) === 'number' ? getEntry(key, habit.id) : 0;
    const mainDone = habit.target ? v >= habit.target : v > 0;
    let repeatDone = true;
    if (habit.type === 'count' && habit.repeatTarget != null) {
      const rv = typeof getEntry(key, habit.id, 'r') === 'number' ? getEntry(key, habit.id, 'r') : 0;
      repeatDone = rv >= habit.repeatTarget;
    }
    return mainDone && repeatDone;
  }

  function skipButton(key, habitId, skipped) {
    return el('button', {
      class: 'icon' + (skipped ? ' skip-on' : ''),
      text: skipped ? '↺' : '⊘',
      title: skipped ? 'Unskip' : 'Skip for today',
      onClick: () => toggleSkip(key, habitId)
    });
  }

  /* ================================================================== */
  /* inline editing                                                      */
  /* ================================================================== */

  /**
   * Replaces `anchor` with an <input>. Commits on Enter/blur, cancels on Esc.
   * opts: { value, type, inputMode, placeholder, width, className, onCommit }
   */
  function inlineEdit(anchor, opts) {
    const input = document.createElement('input');
    input.className = 'inline-input' + (opts.className ? ' ' + opts.className : '');
    input.type = opts.type || 'text';
    if (opts.inputMode) input.inputMode = opts.inputMode;
    if (opts.placeholder) input.placeholder = opts.placeholder;
    input.value = opts.value == null ? '' : String(opts.value);
    if (opts.width) input.style.width = opts.width;

    anchor.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const finish = (commit) => {
      if (settled) return;
      settled = true;
      if (commit) {
        try { opts.onCommit(input.value); } catch (e) { console.error(e); }
      }
      save();
      render();
    };

    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); settled = true; render(); }
    });
  }

  function editNumber(anchor, current, opts) {
    inlineEdit(anchor, {
      value: current == null ? '' : current,
      type: 'number',
      inputMode: 'numeric',
      placeholder: opts && opts.placeholder ? opts.placeholder : '',
      width: '5.5ch',
      onCommit: (raw) => {
        const trimmed = String(raw).trim();
        const n = parseInt(trimmed, 10);
        opts.onCommit(Number.isFinite(n) && n > 0 ? n : null);
      }
    });
  }

  /* ================================================================== */
  /* actions                                                             */
  /* ================================================================== */

    function adjust(key, habit, delta, skipSave, slot) {
    const raw = getEntry(key, habit.id, slot);
    const current = typeof raw === 'number' ? raw : 0;
    const next = Math.max(0, current + delta);
    setEntry(key, habit.id, next, skipSave, slot);
    return next;
  }

  function addSection() {
    const name = prompt('Name of the language or section:');
    if (name === null || !name.trim()) return;
    data.sections.push({ id: uid(), name: name.trim(), habits: [] });
    save();
    render();
  }

  function renameSection(section, anchor) {
    inlineEdit(anchor, {
      value: section.name,
      className: 'name-input',
      width: Math.max(8, section.name.length + 2) + 'ch',
      onCommit: (v) => { if (v.trim()) section.name = v.trim(); }
    });
  }

  function deleteSection(section) {
    if (!confirm(`Delete "${section.name}" and all of its history?`)) return;
    for (const h of section.habits) purgeHabitLogs(h.id);
    data.sections = data.sections.filter(s => s.id !== section.id);
    save();
    render();
  }

  function addHabit(section, type) {
    const habit = {
      id: uid(),
      name: '',
      type,
      step: type === 'time' ? 5 : 1,
      target: null,
      unit: null
    };
    section.habits.push(habit);
    save();
    render();
    // Immediately open the name editor for the new row.
    requestAnimationFrame(() => {
      const nameEl = app.querySelector(`[data-habit-id="${habit.id}"] .name`);
      if (nameEl) nameEl.click();
    });
  }

  function commitHabitName(section, habit, value) {
    const name = String(value).trim();
    if (!name) {
      // Abandoned empty habit → remove it.
      section.habits = section.habits.filter(h => h.id !== habit.id);
      purgeHabitLogs(habit.id);
      return;
    }
    habit.name = name;
  }

  function deleteHabit(section, habit) {
    if (!confirm(`Delete "${habit.name || 'this habit'}" and its history?`)) return;
    purgeHabitLogs(habit.id);
    section.habits = section.habits.filter(h => h.id !== habit.id);
    save();
    render();
  }
 function moveHabit(section, habit, direction) {
  const i = section.habits.findIndex(h => h.id === habit.id);
  const j = i + direction;
  if (i < 0 || j < 0 || j >= section.habits.length) return;
  const [item] = section.habits.splice(i, 1);
  section.habits.splice(j, 0, item);
  save();
  render();
}

function reorderControls(section, habit) {
  const i = section.habits.findIndex(h => h.id === habit.id);
  const last = section.habits.length - 1;
  return [
    el('button', {
      class: 'icon', text: '↑', title: 'Move up',
      disabled: i <= 0,
      onClick: () => moveHabit(section, habit, -1)
    }),
    el('button', {
      class: 'icon', text: '↓', title: 'Move down',
      disabled: i >= last,
      onClick: () => moveHabit(section, habit, 1)
    })
  ];
} 

  function clearAllHistory() {
    if (!confirm('Delete ALL logged history? Your sections and habits stay.')) return;
    data.logs = {};
    save();
    render();
  }

  /* ================================================================== */
  /* rendering                                                           */
  /* ================================================================== */

    const app = document.getElementById('app');
  const subtitle = document.getElementById('subtitle');
  const tabsEl = document.getElementById('tabs');
  const dayStartSlot = document.getElementById('dayStartSlot');

  function render() {
    // highlight the active tab
    for (const btn of tabsEl.querySelectorAll('.tab')) {
      btn.classList.toggle('active', btn.dataset.view === view);
    }

        // day-start dropdown in the topbar
    dayStartSlot.innerHTML = '';
    const h = dayStartHour();
    const select = document.createElement('select');
    select.className = 'chip day-start-select';
    select.title = 'When a new day starts';
    for (let i = 0; i < 24; i++) {
      const opt = document.createElement('option');
      opt.value = String(i);
      const label = i === 0 ? '12 AM'
        : i < 12 ? i + ' AM'
        : i === 12 ? '12 PM'
        : (i - 12) + ' PM';
      opt.textContent = 'New day at ' + label;
      select.append(opt);
    }
    select.value = String(h);
    select.addEventListener('change', () => {
      data.settings = data.settings || {};
      data.settings.dayStartHour = parseInt(select.value, 10);
      currentDay = activeDateKey();
      save();
      render();
    });
    dayStartSlot.append(select);

    // main content
    app.innerHTML = '';
    if (view === 'history') {
      subtitle.textContent = 'All logged days';
      renderHistory();
    } else {
      const key = view === 'yesterday' ? shiftKey(-1) : activeDateKey();
      const [y, m, d] = key.split('-').map(Number);
      subtitle.textContent = new Date(y, m - 1, d).toLocaleDateString(undefined, {
        weekday: 'long', month: 'long', day: 'numeric'
      });
      renderDay(key);
    }
  }

    function renderDay(key) {
    if (data.sections.length === 0) {
      app.append(el('div', { class: 'card empty', text: 'No sections yet — add your first language below.' }));
    }

    for (const section of data.sections) app.append(renderSection(section, key));

    app.append(el('button', { class: 'wide-btn', text: '+ Add language / section', onClick: addSection }));
    app.append(el('p', {
      class: 'note',
      html:
        '<b>Tip:</b> press and hold the −/+ buttons to repeat quickly.<br>' +
        'Tap any name, number or chip to edit it right here.<br>' +
        'Time goals accept <b>1h</b>, <b>1.5h</b>, <b>90m</b> or <b>1h 30m</b>.<br>' +
        'Checkboxes clear automatically each day — everything is stored in this browser only.'
    }));
  }

  function renderSection(section, key) {
    const card = el('section', { class: 'card' });

    const title = el('h2', { text: section.name, title: 'Tap to rename' });
    title.addEventListener('click', () => renameSection(section, title));

    card.append(el('div', { class: 'section-head' },
      title,
      el('div', { class: 'section-actions' },
        el('button', { class: 'chip', text: '+ Task', title: 'Add a done / not-done habit', onClick: () => addHabit(section, 'check') }),
        el('button', { class: 'chip', text: '+ Count', title: 'Add a number counter', onClick: () => addHabit(section, 'count') }),
        el('button', { class: 'chip', text: '+ Time', title: 'Add a time counter', onClick: () => addHabit(section, 'time') }),
        el('button', { class: 'chip danger', text: '×', title: 'Delete section', onClick: () => deleteSection(section) })
      )
    ));

    const list = el('ul', { class: 'habits' });
    if (section.habits.length === 0) {
      list.append(el('li', { class: 'empty-row', text: 'No habits yet — use the buttons above.' }));
    } else {
      for (const habit of section.habits) list.append(renderHabit(section, habit, key));
    }
    card.append(list);

    if (section.habits.length) card.append(renderProgress(section, key));

    return card;
  }

  function renderHabit(section, habit, key) {
    return habit.type === 'check'
      ? renderCheckHabit(section, habit, key)
      : renderCounterHabit(section, habit, key);
  }

  /* ---------- check habit ---------- */

    function renderCheckHabit(section, habit, key) {
    const li = el('li', { class: 'habit check' });
    li.dataset.habitId = habit.id;

    const skipped = isSkipped(key, habit.id);
    const hasRepeat = habit.repeatTarget != null;
    const raw = getEntry(key, habit.id);
    const count = hasRepeat ? (typeof raw === 'number' ? raw : 0) : (raw ? 1 : 0);
    const target = hasRepeat ? habit.repeatTarget : 1;
    const done = hasRepeat ? count >= target : !!raw;

        if (hasRepeat) li.classList.add('has-repeat');
    if (done) li.classList.add('done');
    else if (hasRepeat && count > 0) li.classList.add('partial');
    if (skipped) li.classList.add('skipped');
    if (justLoggedId === habit.id) li.classList.add('just-logged');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = done;
    cb.disabled = skipped;
        cb.addEventListener('change', () => {
      markJustLogged(habit.id);
      if (hasRepeat) {
        setEntry(key, habit.id, count >= target ? 0 : count + 1);
      } else {
        setEntry(key, habit.id, cb.checked ? 1 : 0);
      }
      render();
    });

    const nameEl = el('span', { class: 'name', text: habit.name || 'New habit', title: 'Tap to rename' });
    if (!habit.name) nameEl.style.color = 'var(--muted)';
    nameEl.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      inlineEdit(nameEl, {
        value: habit.name,
        className: 'name-input',
        onCommit: (v) => commitHabitName(section, habit, v)
      });
    });

    const label = el('label', { class: 'check-label' }, cb, nameEl);
        if (hasRepeat) {
      const countClass = 'check-count'
        + (done ? ' done' : (count > 0 ? ' partial' : ''));
      label.append(el('span', {
        class: countClass,
        text: count + '/' + target
      }));
    }

    const repeatIcon = el('button', {
      class: 'icon' + (hasRepeat ? ' rep-on' : ''),
      text: '⟳',
      title: hasRepeat ? `Repeat ×${habit.repeatTarget} — tap to change` : 'Add a repeat count'
    });
    repeatIcon.addEventListener('click', () => {
      inlineEdit(repeatIcon, {
        value: habit.repeatTarget == null ? '' : habit.repeatTarget,
        type: 'number',
        inputMode: 'numeric',
                placeholder: '0 = off',
        width: '7ch',
        onCommit: (raw2) => {
          const n = parseInt(String(raw2).trim(), 10);
          if (Number.isFinite(n) && n > 1) {
            habit.repeatTarget = n;
          } else {
            habit.repeatTarget = null;
          }
        }
      });
    });

    li.append(
      label,
      repeatIcon,
      ...reorderControls(section, habit),
      skipButton(key, habit.id, skipped),
      el('button', { class: 'icon danger', text: '×', title: 'Delete', onClick: () => deleteHabit(section, habit) })
    );

    return li;
  }

  /* ---------- counter / time habit ---------- */

      function renderCounterHabit(section, habit, key) {
    const isTime = habit.type === 'time';
    const li = el('li', { class: 'habit counter' });
    li.dataset.habitId = habit.id;

    const skipped = isSkipped(key, habit.id);
    if (skipped) li.classList.add('skipped');

    function updateDone() {
      li.classList.toggle('is-done', habitIsDone(key, habit));
    }
    updateDone();

    const nameEl = el('span', { class: 'name', text: habit.name || 'New habit', title: 'Tap to rename' });
    if (!habit.name) nameEl.style.color = 'var(--muted)';
    nameEl.addEventListener('click', () => {
      inlineEdit(nameEl, {
        value: habit.name,
        className: 'name-input',
        onCommit: (v) => commitHabitName(section, habit, v)
      });
    });

    li.append(
      el('div', { class: 'habit-head' },
        nameEl,
        el('div', { class: 'habit-head-actions' },
          ...reorderControls(section, habit),
          skipButton(key, habit.id, skipped),
          el('button', { class: 'icon danger', text: '×', title: 'Delete', onClick: () => deleteHabit(section, habit) })
        )
      )
    );

    li.append(buildCounterRow(section, habit, key, null, {
      target: habit.target,
      unit: habit.unit,
      step: habit.step || (isTime ? 5 : 1)
    }, updateDone));

    if (!isTime && habit.repeatTarget != null) {
      const repeatRow = buildCounterRow(section, habit, key, 'r', {
        target: habit.repeatTarget,
        unit: habit.repeatUnit || 'times',
        step: habit.repeatStep || 1
      }, updateDone);
      repeatRow.classList.add('counter-row-repeat');
      li.append(repeatRow);
    }

        li.append(buildMetaRow(section, habit, key, isTime));

    return li;
  }

    function buildCounterRow(section, habit, key, slot, opts, onChange) {
    const row = el('div', { class: 'counter-row' });
    const isTime = habit.type === 'time';
    const valueBtn = el('button', { class: 'value-btn', title: 'Tap to type an exact amount' });

    function currentNumber() {
      const raw = getEntry(key, habit.id, slot);
      return typeof raw === 'number' ? raw : 0;
    }
        function refreshValue() {
      const n = currentNumber();
      valueBtn.textContent = formatCounterValue(habit.type, n, opts.target, opts.unit);
      valueBtn.classList.toggle('has-value', n > 0);
      if (onChange) onChange();
    }
      refreshValue();

    valueBtn.addEventListener('click', () => {
      const current = currentNumber();
      if (isTime) {
        inlineEdit(valueBtn, {
          value: current ? formatMinutes(current) : '',
          placeholder: 'e.g. 1h 30m',
          className: 'value-input',
          onCommit: (raw) => {
            const mins = parseDuration(raw);
            setEntry(key, habit.id, Math.max(0, mins || 0), false, slot);
          }
        });
      } else {
        inlineEdit(valueBtn, {
          value: current,
          type: 'number',
          inputMode: 'numeric',
          className: 'value-input',
          onCommit: (raw) => {
            const n = Math.max(0, Math.round(Number(String(raw).trim()) || 0));
            setEntry(key, habit.id, n, false, slot);
          }
        });
      }
    });

    const step = opts.step;
    const stepLabel = isTime ? step + 'm' : String(step);

    function makeStepButton(label, delta) {
      const btn = el('button', { class: 'step-btn', text: label, type: 'button' });
      let holdTimer = null, repeatTimer = null, didRepeat = false;
      const apply = (skipSave) => { adjust(key, habit, delta, skipSave, slot); refreshValue(); };
      const stopTimers = () => { clearTimeout(holdTimer); clearInterval(repeatTimer); holdTimer = repeatTimer = null; };
      btn.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button !== 0) return;
        didRepeat = false;
        holdTimer = setTimeout(() => {
          didRepeat = true;
          apply(true);
          repeatTimer = setInterval(() => apply(true), 90);
        }, 420);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt =>
        btn.addEventListener(evt, stopTimers)
      );
      btn.addEventListener('click', () => {
        stopTimers();
        if (didRepeat) { didRepeat = false; save(); render(); return; }
        apply(false);
        render();
      });
      return btn;
    }

    row.append(
      makeStepButton('−' + stepLabel, -step),
      el('div', { class: 'value-slot' }, valueBtn),
      makeStepButton('+' + stepLabel, step)
    );
    return row;
  }

  function buildMetaRow(section, habit, key, isTime) {
    const metaRow = el('div', { class: 'meta-row' });

    // goal
    const goalChip = el('button', { class: 'meta-chip' });
    if (habit.target != null) {
      goalChip.textContent = 'goal ' + (isTime ? formatMinutes(habit.target) : habit.target);
      goalChip.title = 'Tap to change the daily goal';
    } else {
      goalChip.textContent = '+ goal';
      goalChip.classList.add('add');
    }
    goalChip.addEventListener('click', () => {
      if (isTime) {
        inlineEdit(goalChip, {
          value: habit.target != null ? formatMinutes(habit.target) : '',
          placeholder: 'e.g. 1h 30m',
          width: '9ch',
          onCommit: (raw) => {
            const mins = parseDuration(raw);
            habit.target = (mins && mins > 0) ? mins : null;
          }
        });
      } else {
        editNumber(goalChip, habit.target, {
          placeholder: 'none',
          onCommit: (n) => { habit.target = n; }
        });
      }
    });
    metaRow.append(goalChip);

    // step
    const step = habit.step || (isTime ? 5 : 1);
    const stepLabel = isTime ? step + 'm' : String(step);
    const stepChip = el('button', { class: 'meta-chip', text: 'step ' + stepLabel, title: 'Tap to change the increment' });
    stepChip.addEventListener('click', () => {
      editNumber(stepChip, step, {
        placeholder: '1',
        onCommit: (n) => { habit.step = n || (isTime ? 5 : 1); }
      });
    });
    metaRow.append(stepChip);

    // unit (counters only)
    if (!isTime) {
      const unitChip = el('button', {
        class: 'meta-chip' + (habit.unit ? '' : ' add'),
        text: habit.unit || '+ unit',
        title: 'Tap to set the unit label'
      });
      unitChip.addEventListener('click', () => {
        inlineEdit(unitChip, {
          value: habit.unit || '',
          placeholder: 'e.g. words',
          width: '8ch',
          onCommit: (v) => { habit.unit = String(v).trim() || null; }
        });
      });
      metaRow.append(unitChip);

      // repeat counter toggle
      const repeatChip = el('button', { class: 'meta-chip' });
      if (habit.repeatTarget != null) {
        repeatChip.textContent = 'repeat ×' + habit.repeatTarget;
        repeatChip.title = 'Tap to change the repeat goal';
      } else {
        repeatChip.textContent = '+ repeat';
        repeatChip.classList.add('add');
        repeatChip.title = 'Add a second counter (e.g. times per day)';
      }
      repeatChip.addEventListener('click', () => {
        inlineEdit(repeatChip, {
          value: habit.repeatTarget == null ? '' : habit.repeatTarget,
          type: 'number',
          inputMode: 'numeric',
          placeholder: '0 = off',
          width: '4ch',
          onCommit: (raw) => {
            const n = parseInt(String(raw).trim(), 10);
            if (Number.isFinite(n) && n > 0) {
              habit.repeatTarget = n;
              if (!habit.repeatUnit) habit.repeatUnit = 'times';
              if (!habit.repeatStep) habit.repeatStep = 1;
            } else {
              habit.repeatTarget = null;
              habit.repeatUnit = null;
              habit.repeatStep = null;
              for (const k of Object.keys(data.logs)) {
                delete data.logs[k][habit.id + ':r'];
                if (Object.keys(data.logs[k]).length === 0) delete data.logs[k];
              }
            }
          }
        });
      });
      metaRow.append(repeatChip);
    }

    return metaRow;
  }

  /* ---------- section progress ---------- */

      function renderProgress(section, key) {
    let total = 0, done = 0;

    for (const h of section.habits) {
      if (isSkipped(key, h.id)) continue;
      total += 1;
      if (habitIsDone(key, h)) done++;
    }

    const pct = total ? Math.round((done / total) * 100) : 0;
    const fill = el('div', { class: 'bar-fill' });
    fill.style.width = pct + '%';

        return el('div', { class: 'progress' },
      el('div', { class: 'progress-text', text: `${done} / ${total} complete` }),
      el('div', { class: 'bar' }, fill)
    );
  }

  /* ---------- history ---------- */

  function renderHistory() {
    const dates = Object.keys(data.logs).sort().reverse();
    let shown = 0;

    for (const key of dates) {
      const day = data.logs[key];
      const groups = [];

      for (const section of data.sections) {
        const rows = [];
                for (const habit of section.habits) {
          const entry = day[habit.id];
          const repeatEntry = day[habit.id + ':r'];
          if (entry !== undefined) {
            rows.push(el('li', {},
              el('span', { class: 'name', text: habit.name || '(untitled)' }),
              el('span', { class: 'value', text: habit.type === 'check'
  ? (habit.repeatTarget != null
      ? (typeof entry === 'number' ? entry : 0) + '/' + habit.repeatTarget
      : '✓')
  : formatValue(habit, entry)
                })
            ));
          }
          if (repeatEntry !== undefined && habit.repeatTarget != null) {
            rows.push(el('li', {},
              el('span', { class: 'name', text: '↳ ' + (habit.name || '(untitled)') + ' (repeat)' }),
              el('span', { class: 'value', text: formatCounterValue('count', repeatEntry, habit.repeatTarget, habit.repeatUnit) })
            ));
          }
        }
        if (rows.length) {
          groups.push(el('div', { class: 'history-group' },
            el('div', { class: 'history-section', text: section.name }),
            el('ul', { class: 'history-list' }, ...rows)
          ));
        }
      }

      if (groups.length === 0) continue;
      shown++;

      const card = el('section', { class: 'card' });
      card.append(el('div', { class: 'section-head' },
        el('h3', { text: friendlyDate(key) }),
        el('button', {
          class: 'chip danger',
          text: 'Delete day',
          onClick: () => {
            if (confirm(`Delete all entries for ${friendlyDate(key)}?`)) {
              delete data.logs[key];
              save();
              render();
            }
          }
        })
      ));
      card.append(...groups);
      app.append(card);
    }

    if (shown === 0) {
      app.append(el('div', { class: 'card empty', text: 'Nothing logged yet. Come back after a day of practice.' }));
    } else {
      app.append(el('button', { class: 'wide-btn danger', text: 'Delete all history', onClick: clearAllHistory }));
    }
  }

  /* ================================================================== */
  /* wiring                                                              */
  /* ================================================================== */

    tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    view = btn.dataset.view;
    render();
  });

  function checkDayChange() {
    const now = activeDateKey();
    if (now !== currentDay) {
      currentDay = now;
      render();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkDayChange();
  });
  setInterval(checkDayChange, 60000);

  render();
})();
</script>
</body>
</html>
