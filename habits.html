<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Language Habit Tracker</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8a8a8e;
    --border: #e3e3e8;
    --accent: #0a84ff;
    --done: #34c759;
    --danger: #ff3b30;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 16px 16px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  /* ---------- top bar ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .topbar h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
  }

  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .section-head h2 { margin: 0; font-size: 17px; cursor: pointer; }
  .section-head h3 { margin: 0; font-size: 15px; }
  .section-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---------- chips ---------- */
  .chip {
    font: inherit; font-size: 12px; line-height: 1;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .chip:active { opacity: .55; }
  .chip.danger { color: var(--danger); }

  /* ---------- habit list ---------- */
  .habits { list-style: none; margin: 0; padding: 0; }
  .habit { border-top: 1px solid var(--border); }
  .habit:first-child { border-top: none; }
  .empty-row { color: var(--muted); font-size: 13px; padding: 8px 0; list-style: none; }

  /* check habit */
  .habit.check {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
  }
  .check-label { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
  .check-label input { width: 21px; height: 21px; accent-color: var(--accent); flex: none; }
  .habit.check .name { font-size: 15px; }
  .habit.check.done .name { color: var(--muted); text-decoration: line-through; }

  /* counter habit */
  .habit.counter { padding: 11px 0 12px; }
  .habit-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .habit-head .name { font-size: 15px; font-weight: 500; }
  .habit.counter.is-done .name { color: var(--done); }

  .counter-row { display: flex; align-items: stretch; gap: 8px; }

  .step-btn {
    flex: none;
    min-width: 62px;
    height: 46px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .step-btn:active { background: var(--border); }

  .value-slot { flex: 1; min-width: 0; display: flex; align-items: center; }
  .value-btn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .value-btn.has-value { color: var(--text); }
  .habit.counter.is-done .value-btn { color: var(--done); }

  .meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; padding-left: 2px; }
  .meta-chip {
    font: inherit;
    font-size: 11.5px;
    line-height: 1;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .meta-chip:active { background: var(--border); }
  .meta-chip.add { color: var(--accent); border-style: dashed; }

  /* ---------- icons ---------- */
  .icon {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 15px; line-height: 1;
    padding: 7px 8px; cursor: pointer; flex: none;
    border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .icon:hover { color: var(--text); }
  .habit-head-actions { display: flex; align-items: center; flex: none; }
.icon[disabled] { opacity: .25; pointer-events: none; }

  /* ---------- inline inputs ---------- */
  .inline-input {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--accent);
    border-radius: 0;
    padding: 2px 3px;
    outline: none;
    min-width: 3ch;
    text-align: center;
  }
  .inline-input.name-input { text-align: left; flex: 1; width: auto !important; min-width: 0; }
  .section-head .name-input { flex: 0 1 auto; width: 12ch !important; }
  .inline-input.value-input { width: 100%; text-align: center; font-weight: 600; }

  /* ---------- progress ---------- */
  .progress { margin-top: 12px; }
  .progress-text { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--done); border-radius: 3px; transition: width .2s ease; }

  /* ---------- history ---------- */
  .history-group { margin-top: 10px; }
  .history-section { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .history-list { list-style: none; margin: 0; padding: 0; }
  .history-list li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 4px 0; }
  .history-list .value { color: var(--muted); }

  /* ---------- misc ---------- */
  .wide-btn {
    display: block; width: 100%;
    padding: 15px;
    margin-bottom: 14px;
    border: 1px dashed var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--accent);
    font: inherit; font-size: 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .wide-btn:active { opacity: .6; }
  .wide-btn.danger { color: var(--danger); }
  .empty { color: var(--muted); text-align: center; font-size: 14px; padding: 28px 12px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; margin: 8px 0 0; }
  .note b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <h1>Language Habits</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="chip" id="viewToggle"></button>
  </header>
  <main id="app"></main>
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'language-habit-tracker-v1';

  /* ================================================================== */
  /* small helpers                                                       */
  /* ================================================================== */

  const uid = () => (self.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else node.setAttribute(k, v);
    }
    for (const child of children.flat(Infinity)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  function dateKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function shiftKey(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    return dateKey(d);
  }
  function friendlyDate(key) {
    if (key === dateKey()) return 'Today';
    if (key === shiftKey(-1)) return 'Yesterday';
    const [y, m, d] = key.split('-').map(Number);
    const opts = { weekday: 'short', month: 'short', day: 'numeric' };
    if (y !== new Date().getFullYear()) opts.year = 'numeric';
    return new Date(y, m - 1, d).toLocaleDateString(undefined, opts);
  }

  function formatMinutes(mins) {
    mins = Math.round(mins);
    if (!mins) return '0m';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (!h) return m + 'm';
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  function formatValue(habit, value) {
    const isTime = habit.type === 'time';
    const main = isTime ? formatMinutes(value) : String(value);
    let out = main;
    if (habit.target != null && habit.target > 0) {
      out += ' / ' + (isTime ? formatMinutes(habit.target) : habit.target);
    }
    if (!isTime && habit.unit) out += ' ' + habit.unit;
    return out;
  }

  /* ================================================================== */
  /* state                                                               */
  /* ================================================================== */

  function starterData() {
    return {
      sections: [
        {
          id: uid(),
          name: 'Spanish',
          habits: [
            { id: uid(), name: 'Anki reviews', type: 'check' },
            { id: uid(), name: 'New words', type: 'count', target: 30, unit: 'words', step: 5 },
            { id: uid(), name: 'Listening practice', type: 'time', target: 30, step: 5 }
          ]
        }
      ],
      logs: {}
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.sections) && parsed.logs && typeof parsed.logs === 'object') {
          return parsed;
        }
      }
    } catch (err) {
      console.warn('Could not read saved data:', err);
    }
    return starterData();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (err) {
      console.warn('Could not save:', err);
    }
  }

  let data = load();
  let view = 'today';
  let currentDay = dateKey();

  /* ================================================================== */
  /* log access                                                          */
  /* ================================================================== */

  function getEntry(key, habitId) {
    const day = data.logs[key];
    return day ? day[habitId] : undefined;
  }

  function setEntry(key, habitId, value, skipSave) {
    const isEmpty = value === undefined || value === null || value === false || value === 0;
    if (isEmpty) {
      const day = data.logs[key];
      if (day) {
        delete day[habitId];
        if (Object.keys(day).length === 0) delete data.logs[key];
      }
    } else {
      (data.logs[key] = data.logs[key] || {})[habitId] = value;
    }
    if (!skipSave) save();
  }

  function purgeHabitLogs(habitId) {
    for (const key of Object.keys(data.logs)) {
      delete data.logs[key][habitId];
      if (Object.keys(data.logs[key]).length === 0) delete data.logs[key];
    }
  }

  /* ================================================================== */
  /* inline editing                                                      */
  /* ================================================================== */

  /**
   * Replaces `anchor` with an <input>. Commits on Enter/blur, cancels on Esc.
   * opts: { value, type, inputMode, placeholder, width, className, onCommit }
   */
  function inlineEdit(anchor, opts) {
    const input = document.createElement('input');
    input.className = 'inline-input' + (opts.className ? ' ' + opts.className : '');
    input.type = opts.type || 'text';
    if (opts.inputMode) input.inputMode = opts.inputMode;
    if (opts.placeholder) input.placeholder = opts.placeholder;
    input.value = opts.value == null ? '' : String(opts.value);
    if (opts.width) input.style.width = opts.width;

    anchor.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const finish = (commit) => {
      if (settled) return;
      settled = true;
      if (commit) {
        try { opts.onCommit(input.value); } catch (e) { console.error(e); }
      }
      save();
      render();
    };

    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); settled = true; render(); }
    });
  }

  function editNumber(anchor, current, opts) {
    inlineEdit(anchor, {
      value: current == null ? '' : current,
      type: 'number',
      inputMode: 'numeric',
      placeholder: opts && opts.placeholder ? opts.placeholder : '',
      width: '5.5ch',
      onCommit: (raw) => {
        const trimmed = String(raw).trim();
        const n = parseInt(trimmed, 10);
        opts.onCommit(Number.isFinite(n) && n > 0 ? n : null);
      }
    });
  }

  /* ================================================================== */
  /* actions                                                             */
  /* ================================================================== */

  function adjust(key, habit, delta, skipSave) {
    const raw = getEntry(key, habit.id);
    const current = typeof raw === 'number' ? raw : 0;
    const next = Math.max(0, current + delta);
    setEntry(key, habit.id, next, skipSave);
    return next;
  }

  function addSection() {
    const name = prompt('Name of the language or section:');
    if (name === null || !name.trim()) return;
    data.sections.push({ id: uid(), name: name.trim(), habits: [] });
    save();
    render();
  }

  function renameSection(section, anchor) {
    inlineEdit(anchor, {
      value: section.name,
      className: 'name-input',
      width: Math.max(8, section.name.length + 2) + 'ch',
      onCommit: (v) => { if (v.trim()) section.name = v.trim(); }
    });
  }

  function deleteSection(section) {
    if (!confirm(`Delete "${section.name}" and all of its history?`)) return;
    for (const h of section.habits) purgeHabitLogs(h.id);
    data.sections = data.sections.filter(s => s.id !== section.id);
    save();
    render();
  }

  function addHabit(section, type) {
    const habit = {
      id: uid(),
      name: '',
      type,
      step: type === 'time' ? 5 : 1,
      target: null,
      unit: null
    };
    section.habits.push(habit);
    save();
    render();
    // Immediately open the name editor for the new row.
    requestAnimationFrame(() => {
      const nameEl = app.querySelector(`[data-habit-id="${habit.id}"] .name`);
      if (nameEl) nameEl.click();
    });
  }

  function commitHabitName(section, habit, value) {
    const name = String(value).trim();
    if (!name) {
      // Abandoned empty habit → remove it.
      section.habits = section.habits.filter(h => h.id !== habit.id);
      purgeHabitLogs(habit.id);
      return;
    }
    habit.name = name;
  }

  function deleteHabit(section, habit) {
    if (!confirm(`Delete "${habit.name || 'this habit'}" and its history?`)) return;
    purgeHabitLogs(habit.id);
    section.habits = section.habits.filter(h => h.id !== habit.id);
    save();
    render();
  }
 function moveHabit(section, habit, direction) {
  const i = section.habits.findIndex(h => h.id === habit.id);
  const j = i + direction;
  if (i < 0 || j < 0 || j >= section.habits.length) return;
  const [item] = section.habits.splice(i, 1);
  section.habits.splice(j, 0, item);
  save();
  render();
}

function reorderControls(section, habit) {
  const i = section.habits.findIndex(h => h.id === habit.id);
  const last = section.habits.length - 1;
  return [
    el('button', {
      class: 'icon', text: '↑', title: 'Move up',
      disabled: i <= 0,
      onClick: () => moveHabit(section, habit, -1)
    }),
    el('button', {
      class: 'icon', text: '↓', title: 'Move down',
      disabled: i >= last,
      onClick: () => moveHabit(section, habit, 1)
    })
  ];
} 

  function clearAllHistory() {
    if (!confirm('Delete ALL logged history? Your sections and habits stay.')) return;
    data.logs = {};
    save();
    render();
  }

  /* ================================================================== */
  /* rendering                                                           */
  /* ================================================================== */

  const app = document.getElementById('app');
  const subtitle = document.getElementById('subtitle');
  const toggleBtn = document.getElementById('viewToggle');

  function render() {
    subtitle.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });
    toggleBtn.textContent = view === 'today' ? 'History →' : '← Today';

    app.innerHTML = '';
    if (view === 'history') renderHistory();
    else renderToday();
  }

  function renderToday() {
    const key = dateKey();

    if (data.sections.length === 0) {
      app.append(el('div', { class: 'card empty', text: 'No sections yet — add your first language below.' }));
    }

    for (const section of data.sections) app.append(renderSection(section, key));

    app.append(el('button', { class: 'wide-btn', text: '+ Add language / section', onClick: addSection }));
    app.append(el('p', {
      class: 'note',
      html:
        '<b>Tip:</b> press and hold the −/+ buttons to repeat quickly.<br>' +
        'Tap any name, number or chip to edit it right here.<br>' +
        'Checkboxes clear automatically each day — everything is stored in this browser only.'
    }));
  }

  function renderSection(section, key) {
    const card = el('section', { class: 'card' });

    const title = el('h2', { text: section.name, title: 'Tap to rename' });
    title.addEventListener('click', () => renameSection(section, title));

    card.append(el('div', { class: 'section-head' },
      title,
      el('div', { class: 'section-actions' },
        el('button', { class: 'chip', text: '+ Task', title: 'Add a done / not-done habit', onClick: () => addHabit(section, 'check') }),
        el('button', { class: 'chip', text: '+ Count', title: 'Add a number counter', onClick: () => addHabit(section, 'count') }),
        el('button', { class: 'chip', text: '+ Time', title: 'Add a time counter', onClick: () => addHabit(section, 'time') }),
        el('button', { class: 'chip danger', text: '×', title: 'Delete section', onClick: () => deleteSection(section) })
      )
    ));

    const list = el('ul', { class: 'habits' });
    if (section.habits.length === 0) {
      list.append(el('li', { class: 'empty-row', text: 'No habits yet — use the buttons above.' }));
    } else {
      for (const habit of section.habits) list.append(renderHabit(section, habit, key));
    }
    card.append(list);

    if (section.habits.length) card.append(renderProgress(section, key));

    return card;
  }

  function renderHabit(section, habit, key) {
    return habit.type === 'check'
      ? renderCheckHabit(section, habit, key)
      : renderCounterHabit(section, habit, key);
  }

  /* ---------- check habit ---------- */

  function renderCheckHabit(section, habit, key) {
    const li = el('li', { class: 'habit check' });
    li.dataset.habitId = habit.id;

    const done = !!getEntry(key, habit.id);
    if (done) li.classList.add('done');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = done;
    cb.addEventListener('change', () => {
      setEntry(key, habit.id, cb.checked ? 1 : 0);
      render();
    });

    const nameEl = el('span', { class: 'name', text: habit.name || 'New habit', title: 'Tap to rename' });
    if (!habit.name) nameEl.style.color = 'var(--muted)';
    nameEl.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      inlineEdit(nameEl, {
        value: habit.name,
        className: 'name-input',
        width: Math.max(8, (habit.name || '').length + 2) + 'ch',
        onCommit: (v) => commitHabitName(section, habit, v)
      });
    });

    li.append(
  el('label', { class: 'check-label' }, cb, nameEl),
  ...reorderControls(section, habit),
  el('button', { class: 'icon danger', text: '×', title: 'Delete', onClick: () => deleteHabit(section, habit) })
);

    return li;
  }

  /* ---------- counter / time habit ---------- */

  function renderCounterHabit(section, habit, key) {
    const isTime = habit.type === 'time';
    const li = el('li', { class: 'habit counter' });
    li.dataset.habitId = habit.id;

    /* --- name row --- */
    const nameEl = el('span', { class: 'name', text: habit.name || 'New habit', title: 'Tap to rename' });
    if (!habit.name) nameEl.style.color = 'var(--muted)';
    nameEl.addEventListener('click', () => {
      inlineEdit(nameEl, {
        value: habit.name,
        className: 'name-input',
        width: Math.max(8, (habit.name || '').length + 2) + 'ch',
        onCommit: (v) => commitHabitName(section, habit, v)
      });
    });

    /* --- value button --- */
    const valueBtn = el('button', { class: 'value-btn', title: 'Tap to type an exact amount' });

    function currentNumber() {
      const raw = getEntry(key, habit.id);
      return typeof raw === 'number' ? raw : 0;
    }

    function refreshValue() {
      const n = currentNumber();
      valueBtn.textContent = formatValue(habit, n);
      valueBtn.classList.toggle('has-value', n > 0);
      li.classList.toggle('is-done', habit.target ? n >= habit.target : n > 0);
    }
    refreshValue();

    valueBtn.addEventListener('click', () => {
      inlineEdit(valueBtn, {
        value: currentNumber(),
        type: 'number',
        inputMode: 'numeric',
        className: 'value-input',
        onCommit: (raw) => {
          const n = Math.max(0, Math.round(Number(String(raw).trim()) || 0));
          setEntry(key, habit.id, n);
        }
      });
    });

    /* --- step buttons (with press-and-hold repeat) --- */
    const step = habit.step || (isTime ? 5 : 1);
    const stepLabel = isTime ? step + 'm' : String(step);

    function makeStepButton(label, delta) {
      const btn = el('button', { class: 'step-btn', text: label, type: 'button' });
      let holdTimer = null;
      let repeatTimer = null;
      let didRepeat = false;

      const apply = (skipSave) => {
        adjust(key, habit, delta, skipSave);
        refreshValue();
      };

      const stopTimers = () => {
        clearTimeout(holdTimer);
        clearInterval(repeatTimer);
        holdTimer = repeatTimer = null;
      };

      btn.addEventListener('pointerdown', (e) => {
        if (e.button != null && e.button !== 0) return;
        didRepeat = false;
        holdTimer = setTimeout(() => {
          didRepeat = true;
          apply(true);                       // first repeat immediately
          repeatTimer = setInterval(() => apply(true), 90);
        }, 420);
      });

      ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt =>
        btn.addEventListener(evt, stopTimers)
      );

      btn.addEventListener('click', () => {
        stopTimers();
        if (didRepeat) {
          didRepeat = false;
          save();
          render();                          // sync progress bars after a hold
          return;
        }
        apply(false);
        render();
      });

      return btn;
    }

    /* --- meta chips --- */
    const metaRow = el('div', { class: 'meta-row' });

    // goal
    const goalChip = el('button', { class: 'meta-chip' });
    if (habit.target != null) {
      goalChip.textContent = 'goal ' + (isTime ? formatMinutes(habit.target) : habit.target);
      goalChip.title = 'Tap to change the daily goal';
    } else {
      goalChip.textContent = '+ goal';
      goalChip.classList.add('add');
      goalChip.title = 'Set a daily goal';
    }
    goalChip.addEventListener('click', () => {
      editNumber(goalChip, habit.target, {
        placeholder: 'none',
        onCommit: (n) => { habit.target = n; }
      });
    });

    // step
    const stepChip = el('button', {
      class: 'meta-chip',
      text: 'step ' + stepLabel,
      title: 'Tap to change the increment'
    });
    stepChip.addEventListener('click', () => {
      editNumber(stepChip, step, {
        placeholder: '1',
        onCommit: (n) => { habit.step = n || (isTime ? 5 : 1); }
      });
    });

    metaRow.append(goalChip, stepChip);

    // unit (counters only)
    if (!isTime) {
      const unitChip = el('button', {
        class: 'meta-chip' + (habit.unit ? '' : ' add'),
        text: habit.unit || '+ unit',
        title: 'Tap to set the unit label'
      });
      unitChip.addEventListener('click', () => {
        inlineEdit(unitChip, {
          value: habit.unit || '',
          placeholder: 'e.g. words',
          width: '8ch',
          onCommit: (v) => { habit.unit = String(v).trim() || null; }
        });
      });
      metaRow.append(unitChip);
    }

    li.append(
  el('div', { class: 'habit-head' },
    nameEl,
    el('div', { class: 'habit-head-actions' },
      ...reorderControls(section, habit),
      el('button', { class: 'icon danger', text: '×', title: 'Delete', onClick: () => deleteHabit(section, habit) })
    )
  ),
      el('div', { class: 'counter-row' },
        makeStepButton('−' + stepLabel, -step),
        el('div', { class: 'value-slot' }, valueBtn),
        makeStepButton('+' + stepLabel, step)
      ),
      metaRow
    );

    return li;
  }

  /* ---------- section progress ---------- */

  function renderProgress(section, key) {
    const habits = section.habits;
    let done = 0;

    for (const h of habits) {
      const entry = getEntry(key, h.id);
      if (h.type === 'check') {
        if (entry) done++;
      } else {
        const v = typeof entry === 'number' ? entry : 0;
        if (h.target ? v >= h.target : v > 0) done++;
      }
    }

    const pct = habits.length ? Math.round((done / habits.length) * 100) : 0;
    const fill = el('div', { class: 'bar-fill' });
    fill.style.width = pct + '%';

    return el('div', { class: 'progress' },
      el('div', { class: 'progress-text', text: `${done} / ${habits.length} complete` }),
      el('div', { class: 'bar' }, fill)
    );
  }

  /* ---------- history ---------- */

  function renderHistory() {
    const dates = Object.keys(data.logs).sort().reverse();
    let shown = 0;

    for (const key of dates) {
      const day = data.logs[key];
      const groups = [];

      for (const section of data.sections) {
        const rows = [];
        for (const habit of section.habits) {
          const entry = day[habit.id];
          if (entry === undefined) continue;
          rows.push(el('li', {},
            el('span', { class: 'name', text: habit.name || '(untitled)' }),
            el('span', { class: 'value', text: habit.type === 'check' ? '✓' : formatValue(habit, entry) })
          ));
        }
        if (rows.length) {
          groups.push(el('div', { class: 'history-group' },
            el('div', { class: 'history-section', text: section.name }),
            el('ul', { class: 'history-list' }, ...rows)
          ));
        }
      }

      if (groups.length === 0) continue;
      shown++;

      const card = el('section', { class: 'card' });
      card.append(el('div', { class: 'section-head' },
        el('h3', { text: friendlyDate(key) }),
        el('button', {
          class: 'chip danger',
          text: 'Delete day',
          onClick: () => {
            if (confirm(`Delete all entries for ${friendlyDate(key)}?`)) {
              delete data.logs[key];
              save();
              render();
            }
          }
        })
      ));
      card.append(...groups);
      app.append(card);
    }

    if (shown === 0) {
      app.append(el('div', { class: 'card empty', text: 'Nothing logged yet. Come back after a day of practice.' }));
    } else {
      app.append(el('button', { class: 'wide-btn danger', text: 'Delete all history', onClick: clearAllHistory }));
    }
  }

  /* ================================================================== */
  /* wiring                                                              */
  /* ================================================================== */

  toggleBtn.addEventListener('click', () => {
    view = view === 'today' ? 'history' : 'today';
    render();
  });

  function checkDayChange() {
    const now = dateKey();
    if (now !== currentDay) {
      currentDay = now;
      render();
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkDayChange();
  });
  setInterval(checkDayChange, 60000);

  render();
})();
</script>
</body>
</html>
