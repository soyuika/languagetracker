<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>PDF Reader with Audio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <style>
        /* ── Reset & base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            max-width: 960px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 32px 36px 40px;
            transition: box-shadow 0.2s;
        }

        @media (max-width: 600px) {
            .app {
                padding: 20px 16px 28px;
            }
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 span {
            background: #eef2ff;
            color: #4f46e5;
            font-size: 18px;
            font-weight: 500;
            padding: 2px 12px;
            border-radius: 40px;
            letter-spacing: 0;
        }

        .header .badge {
            font-size: 13px;
            color: #64748b;
            background: #f1f5f9;
            padding: 4px 14px;
            border-radius: 40px;
            font-weight: 500;
        }

        /* ── Upload zone ── */
        .upload-zone {
            border: 2px dashed #d1d5db;
            border-radius: 18px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s;
            background: #fafbfc;
            position: relative;
        }

        .upload-zone:hover {
            border-color: #a5b4fc;
            background: #f8faff;
        }

        .upload-zone.dragover {
            border-color: #4f46e5;
            background: #eef2ff;
        }

        .upload-zone .icon {
            font-size: 40px;
            margin-bottom: 8px;
            display: block;
        }

        .upload-zone h2 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .upload-zone p {
            color: #64748b;
            font-size: 14px;
        }

        .upload-zone .hint {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 6px;
        }

        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ── File info ── */
        .file-info {
            display: none;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: #f1f5f9;
            border-radius: 14px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .file-info.visible {
            display: flex;
        }

        .file-info .name {
            font-weight: 600;
            font-size: 15px;
            flex: 1;
            min-width: 120px;
            word-break: break-all;
        }

        .file-info .meta {
            font-size: 13px;
            color: #475569;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        .file-info .remove-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
            line-height: 1;
        }

        .file-info .remove-btn:hover {
            color: #ef4444;
        }

        /* ── Progress ── */
        .progress-wrap {
            display: none;
            margin-top: 18px;
        }

        .progress-wrap.visible {
            display: block;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4f46e5, #818cf8);
            border-radius: 10px;
            transition: width 0.25s ease;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #475569;
            margin-top: 6px;
        }

        /* ── Reader ── */
        .reader-wrap {
            display: none;
            margin-top: 24px;
            border-radius: 16px;
            border: 1px solid #e9edf2;
            overflow: hidden;
            background: #fafbfc;
        }

        .reader-wrap.visible {
            display: block;
        }

        /* Reader toolbar */
        .reader-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: #f1f5f9;
            border-bottom: 1px solid #e9edf2;
            flex-wrap: wrap;
            gap: 10px;
        }

        .reader-toolbar .page-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .reader-toolbar .page-nav button {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            line-height: 1.4;
        }

        .reader-toolbar .page-nav button:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .reader-toolbar .page-nav button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .reader-toolbar .page-nav .page-indicator {
            font-size: 15px;
            font-weight: 500;
            min-width: 70px;
            text-align: center;
            color: #1e293b;
        }

        .reader-toolbar .audio-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .reader-toolbar .audio-controls button {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .reader-toolbar .audio-controls button:hover:not(:disabled) {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .reader-toolbar .audio-controls button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .reader-toolbar .audio-controls .playing {
            background: #dbeafe;
            border-color: #4f46e5;
        }

        /* Page content */
        .page-content {
            padding: 28px 32px;
            max-height: 560px;
            overflow-y: auto;
            font-size: 17px;
            line-height: 1.8;
            color: #0f172a;
            background: #ffffff;
            user-select: text;
            -webkit-user-select: text;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-family: -apple-system, BlinkMacSystemFont, "Georgia", "Times New Roman", serif;
        }

        .page-content .empty-page {
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            padding: 40px 0;
        }

        /* Scrollbar */
        .page-content::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .page-content::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        .page-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .page-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ── Error ── */
        .error-msg {
            display: none;
            margin-top: 16px;
            padding: 12px 18px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #b91c1c;
            font-size: 14px;
        }
        .error-msg.visible {
            display: block;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .reader-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .reader-toolbar .page-nav {
                justify-content: center;
            }
            .reader-toolbar .audio-controls {
                justify-content: center;
            }
            .page-content {
                padding: 18px 20px;
                font-size: 16px;
                max-height: 440px;
            }
            .header h1 {
                font-size: 22px;
            }
        }

        /* ── Utilities ── */
        .hidden {
            display: none !important;
        }
        .fade-in {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Empty state inside reader ── */
        .reader-empty {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .reader-empty .big-icon {
            font-size: 56px;
            display: block;
            margin-bottom: 12px;
        }
        .reader-empty p {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="app" role="main">

        <!-- Header -->
        <div class="header">
            <h1>
                📖 PDF
                <span>Reader</span>
            </h1>
            <span class="badge">🔊 with speech</span>
        </div>

        <!-- Upload Zone -->
        <div class="upload-zone" id="uploadZone">
            <span class="icon">📤</span>
            <h2>Drop your PDF here</h2>
            <p>or click to browse</p>
            <div class="hint">Supports large files · all pages extracted</div>
            <input type="file" id="fileInput" accept=".pdf" />
        </div>

        <!-- File info -->
        <div class="file-info" id="fileInfo">
            <span class="name" id="fileName">file.pdf</span>
            <div class="meta">
                <span id="fileSize">📦 0 MB</span>
                <span id="pageCount">📄 0 pages</span>
            </div>
            <button class="remove-btn" id="removeFileBtn" aria-label="Remove file">✕</button>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-label">
                <span id="progressText">Extracting…</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Reader -->
        <div class="reader-wrap" id="readerWrap">
            <div class="reader-toolbar">
                <div class="page-nav">
                    <button id="prevPageBtn" aria-label="Previous page">◀</button>
                    <span class="page-indicator" id="pageIndicator">1 / 1</span>
                    <button id="nextPageBtn" aria-label="Next page">▶</button>
                </div>
                <div class="audio-controls">
                    <button id="readPageBtn">▶ Read This Page</button>
                    <button id="readFromHereBtn">▶ Read from Here</button>
                    <button id="stopBtn">⏹ Stop</button>
                </div>
            </div>
            <div class="page-content" id="pageContent">
                <div class="reader-empty">
                    <span class="big-icon">📖</span>
                    <p>Extracted pages will appear here.<br />Use the controls to navigate and listen.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const pageCount = document.getElementById('pageCount');
            const removeFileBtn = document.getElementById('removeFileBtn');
            const progressWrap = document.getElementById('progressWrap');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const progressPercent = document.getElementById('progressPercent');
            const errorMsg = document.getElementById('errorMsg');
            const readerWrap = document.getElementById('readerWrap');
            const pageContent = document.getElementById('pageContent');
            const prevPageBtn = document.getElementById('prevPageBtn');
            const nextPageBtn = document.getElementById('nextPageBtn');
            const pageIndicator = document.getElementById('pageIndicator');
            const readPageBtn = document.getElementById('readPageBtn');
            const readFromHereBtn = document.getElementById('readFromHereBtn');
            const stopBtn = document.getElementById('stopBtn');

            // ── State ──
            let currentFile = null;
            let isProcessing = false;
            let pageTexts = []; // array of strings, one per page
            let totalPages = 0;
            let currentPage = 0; // 0‑based index
            let speechSynth = window.speechSynthesis;
            let utterance = null;
            let isReading = false;
            let continuousMode = false; // true if reading from current page onward
            let currentReadingPage = 0; // page being read in continuous mode

            // ── PDF.js setup ──
            const pdfjsLib = window['pdfjs-dist/build/pdf'];
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            // ── Helpers ──
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1048576).toFixed(1) + ' MB';
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.classList.add('visible');
                setTimeout(() => errorMsg.classList.remove('visible'), 8000);
            }

            function clearError() {
                errorMsg.classList.remove('visible');
                errorMsg.textContent = '';
            }

            function stopSpeech() {
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                }
                isReading = false;
                continuousMode = false;
                updateAudioButtons();
            }

            // ── Display page ──
            function displayPage(index) {
                if (!pageTexts.length || index < 0 || index >= pageTexts.length) return;
                currentPage = index;
                const text = pageTexts[index] || '';
                // Clear and set content
                pageContent.innerHTML = '';
                if (text.trim() === '') {
                    const empty = document.createElement('div');
                    empty.className = 'empty-page';
                    empty.textContent = '(This page is empty)';
                    pageContent.appendChild(empty);
                } else {
                    const p = document.createElement('p');
                    p.textContent = text;
                    p.style.margin = '0';
                    pageContent.appendChild(p);
                }
                // Update indicator
                pageIndicator.textContent = `${index + 1} / ${totalPages}`;
                // Update buttons
                prevPageBtn.disabled = (index === 0);
                nextPageBtn.disabled = (index === totalPages - 1);
                // Scroll to top
                pageContent.scrollTop = 0;
            }

            function goToPage(index) {
                if (isReading && continuousMode) {
                    // If currently reading continuously, stop before navigating
                    stopSpeech();
                }
                displayPage(index);
            }

            function prevPage() {
                if (currentPage > 0) goToPage(currentPage - 1);
            }

            function nextPage() {
                if (currentPage < totalPages - 1) goToPage(currentPage + 1);
            }

            // ── Speech functions ──
            function speakText(text, callback) {
                if (!text || text.trim() === '') {
                    showError('No text to read on this page.');
                    return;
                }
                // Cancel any ongoing speech
                if (speechSynth.speaking) {
                    speechSynth.cancel();
                }
                utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;
                // For iOS, we may need to set voice, but default is fine.

                utterance.onend = function() {
                    isReading = false;
                    updateAudioButtons();
                    if (callback) callback();
                };
                utterance.onerror = function(event) {
                    console.warn('Speech error:', event);
                    isReading = false;
                    updateAudioButtons();
                    if (callback) callback();
                };

                isReading = true;
                updateAudioButtons();
                speechSynth.speak(utterance);
            }

            function readCurrentPage() {
                if (!pageTexts.length) return;
                stopSpeech(); // stop any ongoing
                const text = pageTexts[currentPage];
                if (!text || text.trim() === '') {
                    showError('This page has no text to read.');
                    return;
                }
                continuousMode = false;
                speakText(text);
            }

            function readFromHere() {
                if (!pageTexts.length) return;
                stopSpeech();
                const start = currentPage;
                const texts = pageTexts.slice(start).filter(t => t.trim() !== '');
                if (texts.length === 0) {
                    showError('No readable text from this page onward.');
                    return;
                }
                continuousMode = true;
                currentReadingPage = start;
                // Read sequentially
                readNextInSequence(start);
            }

            function readNextInSequence(pageIndex) {
                if (!continuousMode) return;
                if (pageIndex >= pageTexts.length) {
                    continuousMode = false;
                    isReading = false;
                    updateAudioButtons();
                    return;
                }
                const text = pageTexts[pageIndex];
                if (!text || text.trim() === '') {
                    // skip empty pages
                    readNextInSequence(pageIndex + 1);
                    return;
                }
                currentReadingPage = pageIndex;
                // Optionally navigate to the page being read
                if (currentPage !== pageIndex) {
                    displayPage(pageIndex);
                }
                speakText(text, function() {
                    // After this page, continue to next
                    if (continuousMode) {
                        readNextInSequence(pageIndex + 1);
                    } else {
                        updateAudioButtons();
                    }
                });
            }

            // ── Update button states ──
            function updateAudioButtons() {
                if (isReading) {
                    readPageBtn.textContent = '⏵ Reading…';
                    readPageBtn.disabled = true;
                    readFromHereBtn.textContent = '⏵ Reading…';
                    readFromHereBtn.disabled = true;
                    stopBtn.disabled = false;
                } else {
                    readPageBtn.textContent = '▶ Read This Page';
                    readPageBtn.disabled = false;
                    readFromHereBtn.textContent = '▶ Read from Here';
                    readFromHereBtn.disabled = false;
                    stopBtn.disabled = true;
                }
            }

            // ── Reset reader ──
            function resetReader() {
                stopSpeech();
                pageTexts = [];
                totalPages = 0;
                currentPage = 0;
                readerWrap.classList.remove('visible');
                pageContent.innerHTML = `
                    <div class="reader-empty">
                        <span class="big-icon">📖</span>
                        <p>Extracted pages will appear here.<br />Use the controls to navigate and listen.</p>
                    </div>
                `;
                pageIndicator.textContent = '0 / 0';
                prevPageBtn.disabled = true;
                nextPageBtn.disabled = true;
                updateAudioButtons();
            }

            // ── Extraction ──
            async function extractTextFromPDF(file) {
                if (isProcessing) return;
                isProcessing = true;
                stopSpeech();
                resetReader();
                clearError();

                // Show file info
                fileInfo.classList.add('visible');
                fileName.textContent = file.name;
                fileSize.textContent = '📦 ' + formatFileSize(file.size);

                // Show progress
                progressWrap.classList.add('visible');
                progressFill.style.width = '0%';
                progressText.textContent = 'Loading PDF…';
                progressPercent.textContent = '0%';

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    totalPages = pdf.numPages;
                    pageCount.textContent = '📄 ' + totalPages + ' pages';

                    if (totalPages === 0) {
                        throw new Error('This PDF appears to have no pages.');
                    }

                    const extracted = [];
                    for (let i = 1; i <= totalPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        const pageText = content.items.map(item => item.str).join(' ');
                        const trimmed = pageText.replace(/\s+/g, ' ').trim();
                        extracted.push(trimmed);

                        const pct = Math.round((i / totalPages) * 100);
                        progressFill.style.width = pct + '%';
                        progressPercent.textContent = pct + '%';
                        progressText.textContent = `Page ${i} of ${totalPages}`;

                        await new Promise(r => requestAnimationFrame(r));
                    }

                    pageTexts = extracted;
                    // Show reader
                    readerWrap.classList.add('visible');
                    // Display first page
                    currentPage = 0;
                    displayPage(0);
                    updateAudioButtons();

                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    progressText.textContent = `✓ Extracted ${totalPages} pages`;
                    setTimeout(() => {
                        progressWrap.classList.remove('visible');
                    }, 1200);

                } catch (err) {
                    console.error('Extraction error:', err);
                    showError('❌ ' + (err.message || 'Failed to extract text.'));
                    resetReader();
                } finally {
                    isProcessing = false;
                }
            }

            // ── File handler ──
            function handleFile(file) {
                if (!file || file.type !== 'application/pdf') {
                    showError('Please select a valid PDF file.');
                    return;
                }
                if (isProcessing) {
                    showError('Already processing. Please wait.');
                    return;
                }
                currentFile = file;
                extractTextFromPDF(file);
            }

            // ── Remove file ──
            function removeFile() {
                if (isProcessing) {
                    showError('Please wait for extraction to finish.');
                    return;
                }
                stopSpeech();
                currentFile = null;
                fileInput.value = '';
                fileInfo.classList.remove('visible');
                progressWrap.classList.remove('visible');
                resetReader();
                clearError();
            }

            // ── Event listeners ──
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleFile(this.files[0]);
                }
                this.value = '';
            });

            uploadZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            uploadZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            uploadZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files && files.length > 0) {
                    handleFile(files[0]);
                }
            });

            removeFileBtn.addEventListener('click', removeFile);

            prevPageBtn.addEventListener('click', prevPage);
            nextPageBtn.addEventListener('click', nextPage);

            readPageBtn.addEventListener('click', readCurrentPage);
            readFromHereBtn.addEventListener('click', readFromHere);
            stopBtn.addEventListener('click', function() {
                stopSpeech();
            });

            // Keyboard shortcuts (optional)
            document.addEventListener('keydown', function(e) {
                if (readerWrap.classList.contains('visible')) {
                    if (e.key === 'ArrowLeft') { prevPage(); e.preventDefault(); }
                    if (e.key === 'ArrowRight') { nextPage(); e.preventDefault(); }
                    if (e.key === ' ' && e.target === document.body) {
                        e.preventDefault();
                        if (isReading) stopSpeech();
                        else readCurrentPage();
                    }
                }
            });

            // ── Initialise ──
            resetReader();
            console.log('📖 PDF Reader with speech ready – upload a PDF to start.');
        })();
    </script>

</body>
</html>
